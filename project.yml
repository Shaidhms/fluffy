name: GooglyEyes
options:
  bundleIdPrefix: com.shaid.fluffy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GooglyEyes:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaid.fluffy.phone
        PRODUCT_NAME: Fluffy
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # Pick your own team in Xcode (Signing & Capabilities) the first time you run it.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Fluffy
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Fluffy finds the Mac app on your Wi-Fi so the character can look where it points.
        NSMicrophoneUsageDescription: Talk to your cat. He listens while he's awake (double tap him to wake him up or put him to sleep).
        NSBonjourServices:
          - _fluffy._tcp
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
